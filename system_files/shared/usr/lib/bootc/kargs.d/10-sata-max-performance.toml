# SATA Link Power Management Off
#
# WHY THIS EXISTS:
# The 2 TB Fanxiang S101Q data SSD freezes under long, heavy reads when its SATA
# link is in the kernel's default power-saving mode (min_power_with_partial).
# The drive misses its wake-up, reads time out (READ FPDMA QUEUED), the link is
# hard-reset, and XFS shuts the filesystem down. This happened on 2026-06-10 and
# 2026-11-14. With the link held at full power, it ran clean.
#
# WHAT THIS DOES:
# Adds the kernel argument ahci.mobile_lpm_policy=1 (max_performance), which keeps
# every SATA link at full power. Despite the name, it applies to desktop chipsets
# too. Costs a little idle power, which matters on a laptop, not on a desktop.
# bootc applies it on the next `bootc upgrade` or `bootc switch`.
#
# CHECK AFTER REBOOT:
#   cat /proc/cmdline                                   # contains ahci.mobile_lpm_policy=1
#   cat /sys/class/scsi_host/host*/link_power_management_policy   # max_performance
kargs = ["ahci.mobile_lpm_policy=1"]
